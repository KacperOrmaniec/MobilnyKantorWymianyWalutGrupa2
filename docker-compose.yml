services:
  db:
    image: postgres:17
    container_name: kantor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kantor}
      POSTGRES_USER: ${POSTGRES_USER:-kantor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
