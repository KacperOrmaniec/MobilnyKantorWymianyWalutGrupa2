services:
  db:
    image: postgres:17
    restart: unless-stopped
    entrypoint: ["bash", "/opt/kantor-db/start-db.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kantor}
      POSTGRES_USER: ${POSTGRES_USER:-kantor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/database:/opt/kantor-db:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/kantor-schema-ready && pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ConnectionStrings__KantorDb: "Host=db;Port=5432;Database=${POSTGRES_DB:-kantor};Username=${POSTGRES_USER:-kantor};Password=${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}"
      Jwt__Key: ${JWT_KEY:?Ustaw JWT_KEY w pliku .env (min. 32 znaki)}
    ports:
      - "${API_PORT:-5171}:8080"
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  db-data:
  pgadmin-data:
